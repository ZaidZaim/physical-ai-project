ck</text><text x="335.0" y="96.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">GPT-Live hears it live</text><rect x="500" y="40" width="170" height="80" rx="10" fill="#151b23" stroke="#6e7681" stroke-width="1.2"/><text x="585.0" y="76.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Dropped</text><text x="585.0" y="96.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">nothing played or kept</text><rect x="240" y="200" width="190" height="80" rx="10" fill="#d96ca0" stroke="#d96ca0" stroke-width="1.2"/><text x="335.0" y="236.0" font-size="15" font-weight="600" fill="#0d1117" text-anchor="middle">Call</text><text x="335.0" y="256.0" font-size="12" font-weight="400" fill="#0d1117" text-anchor="middle">answers in about 1 s</text><rect x="500" y="200" width="170" height="80" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="585.0" y="236.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Backend tools</text><text x="585.0" y="256.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">tricks · what it sees</text><rect x="720" y="120" width="160" height="80" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="800.0" y="156.0" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Goodbye</text><text x="800.0" y="176.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">the call closes</text><rect x="720" y="260" width="160" height="80" rx="10" fill="#a98cf5" stroke="#a98cf5" stroke-width="1.2"/><text x="800.0" y="296.0" font-size="15" font-weight="600" fill="#0d1117" text-anchor="middle">Anonymous note</text><text x="800.0" y="316.0" font-size="12" font-weight="400" fill="#0d1117" text-anchor="middle">topics · questions → Aura</text><path d="M180 80 H238" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#a6e7681)"/><path d="M430 80 H498" fill="none" stroke="#6e7681" stroke-width="1.6" mar