[project]
name = "puppy-mind"
version = "0.1.0"
description = "Physical AI for Hiwonder PuppyPi: camera -> Neo4j graph memory -> grounded Q&A"
requires-python = ">=3.10"
dependencies = [
  "neo4j>=5.23",
  "openai>=1.60",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pillow>=10.3",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
puppy-mind = "puppy_mind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puppy_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
